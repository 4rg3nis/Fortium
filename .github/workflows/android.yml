name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      # Se usa 'assembleDebug' para compilar solo la versión de desarrollo.
      # Se añade '-x lint' para evitar que el build falle por errores de análisis estático,
      # permitiendo que el flujo continúe hacia los tests unitarios.
      run: ./gradlew assembleDebug -x lint
      
      # Para que ejecute los tests unitarios, que cada implementacion no rompa la logica principal de la aplicacion
    - name: Ejecutar Tests Unitarios (Lógica y ViewModels)
      run: ./gradlew testDebugUnitTest
